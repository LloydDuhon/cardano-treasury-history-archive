name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install ruff
        run: python -m pip install --upgrade pip ruff==0.6.9

      - name: ruff check
        working-directory: etl
        run: ruff check .

      - name: ruff format --check
        working-directory: etl
        run: ruff format --check .

  validate-schemas:
    name: validate JSON Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: etl/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Check schemas are themselves valid
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schemas = Path("schemas").glob("*.schema.json")
          failed = False
          for s in sorted(schemas):
              with s.open() as fh:
                  schema = json.load(fh)
              try:
                  Draft202012Validator.check_schema(schema)
                  print(f"OK   {s}")
              except Exception as exc:
                  print(f"FAIL {s}: {exc}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Validate dataset against schemas
        run: python etl/validators/validate_against_schema.py
